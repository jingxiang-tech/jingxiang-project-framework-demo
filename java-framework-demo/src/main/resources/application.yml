server:
  address: 127.0.0.1
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: jingxiang-project-framework-demo
  jackson2:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  http:
    converters:
      # @DictSerialize 基于 Jackson 2，不能切到 Boot 4 默认的 Jackson 3。
      preferred-json-mapper: jackson2
  datasource:
    # 本机 MySQL。库不存在时驱动会创建，表结构由 schema.sql 初始化。
    url: jdbc:mysql://127.0.0.1:3306/framework_demo?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&allowMultiQueries=true
    username: root
    password: root
  sql:
    init:
      mode: always

mybatis-plus:
  mapper-locations: classpath*:com/jingxiang/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helper-dialect: mysql
  reasonable: false
  support-methods-arguments: true

jingxiang:
  component:
    common:
      dict:
        path:
          - com.jingxiang.framework.demo
